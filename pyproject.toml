[project]
name = "interview-coach"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sadikshachitrakar", email = "sadiksha.chitrakar101@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.31.0",
    "jinja2>=3.1.6",
    "pipecat-ai[groq,kokoro,runner,silero,webrtc]>=1.12.0",
    "pypdf>=6.21.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
]

[project.scripts]
interview-coach = "interview_coach:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pipecat-ai[evals]>=1.12.0",
]
